# This is a basic workflow to help you get started with MATLAB Actions

name: MATLAB Build

# Controls when the action will run. 
on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [R2026b]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # build the MEX files with the newest gcc/g++ the runner's Ubuntu packages
        run: |
          sudo apt-get update
          v=$(apt-cache pkgnames g++- | grep -E '^g\+\+-[0-9]+$' | sed 's/^g++-//' | sort -n | tail -1)
          sudo apt-get install -y gcc-$v g++-$v libopenblas-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$v 100 --slave /usr/bin/g++ g++ /usr/bin/g++-$v
          gcc --version
      - if: runner.os == 'Windows'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: >
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            MATLAB_Support_for_MinGW-w64_C/C++/Fortran_Compiler
      - if: runner.os == 'Windows'
        uses: matlab-actions/run-command@v3
        with:
          command: |
            mex(['-setup:' fullfile(matlabroot,'bin','win64','mexopts','mingw64_g++.xml')],'C++')
            mex(['-setup:' fullfile(matlabroot,'bin','win64','mexopts','mingw64.xml')],'C')
      - if: runner.os == 'Linux'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: >
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
      - if: runner.os == 'macOS'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: >
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
      - name: Run build
        uses: matlab-actions/run-build@v3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdasrvf-${{ matrix.os }}
          path: release/fdasrvf.mltbx
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # unpacks default artifact into release/
          # if `name: artifact` is omitted, the action will create extra parent dir
          pattern: fdasrvf-*
          path: ./release/
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/fdasrvf-ubuntu-latest/fdasrvf.mltbx
          asset_name: fdasrvf-ubuntu-latest.mltbx
          asset_content_type: application/mltbx
      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/fdasrvf-windows-latest/fdasrvf.mltbx
          asset_name: fdasrvf-windows-latest.mltbx
          asset_content_type: application/mltbx
      - name: Upload MacOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/fdasrvf-macos-latest/fdasrvf.mltbx
          asset_name: fdasrvf-macos-latest.mltbx
          asset_content_type: application/mltbx
